<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <!-- Primary SEO -->
    <title>Inclusive Market — PWD Marketplace of Zamboanga | Shop with Purpose</title>
    <meta name="description" content="Inclusive Market is an accessible e-commerce marketplace empowering PWD-led enterprises of Zamboanga City (AVRC Region IX). Shop handmade food, crafts and goods — every purchase empowers persons with disabilities." />
    <meta name="keywords" content="Inclusive Market, PWD marketplace, Zamboanga, AVRC Region IX, persons with disability products, accessible shopping, PWD livelihood, DSWD" />
    <meta name="author" content="InkluTeam · Inclusive Market" />
    <meta name="robots" content="index, follow" />
    <meta name="theme-color" content="#0E7490" />
    <link rel="canonical" href="https://inclusive-market.vercel.app/" />

    <!-- Open Graph (Facebook / LinkedIn) -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Inclusive Market" />
    <meta property="og:title" content="Inclusive Market — PWD Marketplace of Zamboanga" />
    <meta property="og:description" content="Shop unique, high-quality products from PWD-led enterprises of Zamboanga Peninsula. Every purchase empowers persons with disabilities at AVRC Region IX." />
    <meta property="og:url" content="https://inclusive-market.vercel.app/" />
    <meta property="og:image" content="https://inclusive-market.vercel.app/images/basket.jpg" />
    <meta property="og:locale" content="en_PH" />

    <!-- Twitter -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Inclusive Market — PWD Marketplace of Zamboanga" />

    <meta name="twitter:image" content="https://inclusive-market.vercel.app/images/basket.jpg" />

    <!-- Structured data for search engines -->
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "OnlineStore",
      "name": "Inclusive Market",
      "url": "https://inclusive-market.vercel.app/",
      "description": "Accessible marketplace empowering PWD-led enterprises of Zamboanga City, Philippines.",
      "areaServed": { "@type": "Place", "address": { "@type": "PostalAddress", "addressLocality": "Zamboanga City", "addressCountry": "PH" } },
      "currenciesAccepted": "PHP",
      "paymentAccepted": "Cash on Delivery, GCash, Maya",
      "inLanguage": "en-PH"
    }
    </script>

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
